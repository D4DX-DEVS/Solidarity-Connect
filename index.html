<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- PWA manifest (auto-generated by vite-plugin-pwa at build time) -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Icons -->
    <link rel="icon" href="/logo-icon.png" sizes="any" />
    <link rel="icon" href="/logo-icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/logo-icon.png" />

    <!-- Viewport (viewport-fit=cover for notch devices) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA / standalone meta -->
    <meta name="theme-color" content="#dc2626" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SOLIDARITY" />
    <meta name="application-name" content="SOLIDARITY" />
    <meta name="msapplication-TileColor" content="#dc2626" />
    <meta name="msapplication-TileImage" content="/logo-icon.png" />

    <!-- Primary meta -->
    <title>SOLIDARITY - Members Management System</title>
    <meta name="description" content="Comprehensive members management system for SOLIDARITY Youth Movement Kerala with multi-level administration" />
    <meta name="author" content="SOLIDARITY" />

    <!-- Open Graph -->
    <meta property="og:title" content="SOLIDARITY - Members Management System" />
    <meta property="og:description" content="Comprehensive members management system for SOLIDARITY Youth Movement Kerala" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/logo.jpg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
